- q: "top 3 khách có công nợ lớn nhất đến hết ngày 14/08/2026 và số nợ của từng người"
  type: table
  periods: ["P1 = until:2026-08-14"]
  columns: [khach_hang, so_tien_no]
  requires: [orders, payments]
  sql: |
    WITH paid AS (
      SELECT order_id, SUM(pay_amount) AS paid FROM payments WHERE pay_date < {P1.end} GROUP BY order_id
    ), d AS (
      SELECT o.customer_key, o.customer_display, o.total_payable - COALESCE(p.paid, 0) AS owe
      FROM orders o LEFT JOIN paid p ON p.order_id = o.order_id
      WHERE COALESCE(o.status, '') <> 'huy' AND o.order_date < {P1.end} AND NOT o.is_walkin
        AND COALESCE(o.payment_method, '') <> 'cod'
        -- bỏ cả kênh sàn TMĐT nếu rulebook nói đơn qua sàn không phải khách nợ
    )
    SELECT customer_display AS khach_hang, SUM(owe) AS so_tien_no
    FROM d WHERE owe > 0
    GROUP BY customer_key, customer_display
    ORDER BY so_tien_no DESC, customer_key
    LIMIT 3

- q: "liệt kê 3 khách nợ nhiều nhất tính đến hết ngày 24/06/2026, kèm số tiền còn nợ"
  type: table
  periods: ["P1 = until:2026-06-24"]
  columns: [khach_hang, so_tien_no]
  requires: [orders]
  absent: [payments]
  sql: |
    -- chỉ có cột debt_amount (nợ tại ngày cuối dữ liệu); đúng khi hôm nay = ngày cuối dữ liệu
    SELECT customer_display AS khach_hang, SUM(debt_amount) AS so_tien_no
    FROM orders
    WHERE COALESCE(status, '') <> 'huy' AND NOT is_walkin AND debt_amount > 0
    GROUP BY customer_key, customer_display
    ORDER BY so_tien_no DESC, customer_key
    LIMIT 3

