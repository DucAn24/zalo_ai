# Few-shot exemplars written against the CANONICAL schema (valid_orders, valid_lines, ...), not a
# specific shop. Retrieval (TF-IDF on the question) picks the closest ones among those whose
# `requires` tables/columns exist for the shop (`absent`: tables that must NOT exist).
# Dates are never written by hand: periods are declared in `periods` and referenced as {P1:col},
# {P1.start}, {P1.end} (exclusive), {P1.last}; shifts as {SHIFT:ca_chieu:col}.
# Only intent families seen in the dev group were used to write these.

- q: "Doanh thu tháng 10/2025 là bao nhiêu?"
  type: number
  periods: ["P1 = month:2025-10"]
  requires: [valid_lines]
  sql: |
    SELECT COALESCE(SUM(line_amount), 0) AS doanh_thu
    FROM valid_lines
    WHERE {P1:order_date}

- q: "tổng doanh thu hôm qua là bn"
