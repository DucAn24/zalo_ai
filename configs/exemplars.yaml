- q: "xét 3 tháng 3/2025, 4/2025 và 5/2025, doanh thu tháng nào lớn nhất"
  type: date
  periods: ["P1 = month:2025-03", "P2 = month:2025-04", "P3 = month:2025-05"]
  requires: [valid_lines]
  sql: |
    SELECT strftime(m, '%Y-%m') AS thang FROM (
      SELECT {P1.start} AS m, (SELECT SUM(line_amount) FROM valid_lines WHERE {P1:order_date}) AS s
      UNION ALL SELECT {P2.start}, (SELECT SUM(line_amount) FROM valid_lines WHERE {P2:order_date})
      UNION ALL SELECT {P3.start}, (SELECT SUM(line_amount) FROM valid_lines WHERE {P3:order_date})
    ) ORDER BY s DESC LIMIT 1

