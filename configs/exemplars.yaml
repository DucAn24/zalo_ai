  sql: |
    SELECT 100.0 * (a.s - b.s) / NULLIF(b.s, 0) AS thay_doi
    FROM (SELECT SUM(line_amount) AS s FROM valid_lines WHERE {P1:order_date}) a,
         (SELECT SUM(line_amount) AS s FROM valid_lines WHERE {P2:order_date}) b

