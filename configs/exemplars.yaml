- q: "trong tháng 6/2025, Yumangel hộp 20 gói nhập vào giá bình quân một hộp là bao nhiêu"
  type: number
  periods: ["P1 = month:2025-06"]
  decimals: 0
  entities: ["mặt hàng: 'Yumangel hộp 20 gói' → cột product_name"]
  requires: [imports, import_lines]
  sql: |
    -- bình quân theo số lượng nhập, theo đơn vị nhập của dòng
    SELECT SUM(l.line_amount) * 1.0 / NULLIF(SUM(l.qty), 0)
    FROM import_lines l JOIN imports i ON i.import_id = l.import_id
    WHERE NOT i.is_cancelled AND l.product_name = 'Yumangel hộp 20 gói' AND l.unit = 'hộp' AND {P1:i.import_date}

