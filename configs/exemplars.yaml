- q: "Hết hôm nay trong kho còn bao nhiêu thùng Coca Cola nguyên và bao nhiêu lon lẻ?"
  type: list
  periods: ["P1 = until_today"]
  entities: ["mặt hàng: 'Coca Cola 330ml' → cột product_name"]
  requires: [stock, unit_conv]
  sql: |
    SELECT CAST(floor(s.stock_qty / c.factor) AS BIGINT) AS nguyen,
           CAST(s.stock_qty - floor(s.stock_qty / c.factor) * c.factor AS BIGINT) AS le
    FROM stock s JOIN unit_conv c ON c.product_name = s.product_name AND c.unit = 'thùng'
    WHERE s.product_name = 'Coca Cola 330ml'

